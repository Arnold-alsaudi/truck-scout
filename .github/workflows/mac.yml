name: Build Mac app

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Mac version number (release tag mac-v<N>)"
        required: true
      only:
        description: "Build only this arch (apple-silicon / intel), empty = both"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26
            arch: apple-silicon
          - runner: macos-15-intel
            arch: intel
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r mac/requirements.txt pyinstaller pillow

      - name: Set version
        run: sed -i '' "s/^VERSION = .*/VERSION = ${{ inputs.version }}/" mac/app/main.py

      - name: Icon
        run: |
          python mac/make_icon.py icon.png
          mkdir icon.iconset
          for s in 16 32 64 128 256 512; do
            sips -z $s $s icon.png --out icon.iconset/icon_${s}x${s}.png >/dev/null
            d=$((s*2)); sips -z $d $d icon.png --out icon.iconset/icon_${s}x${s}@2x.png >/dev/null
          done
          iconutil -c icns icon.iconset -o icon.icns

      - name: Source self-test
        run: cd mac/app && python main.py --selftest

      - name: Build .app
        run: |
          pyinstaller --noconfirm --windowed --name "Saad Shard Sniper" \
            --icon icon.icns --osx-bundle-identifier com.saad.shardsniper \
            --add-data "mac/app/ui:ui" --paths mac/app \
            --hidden-import webview.platforms.cocoa --exclude-module winos \
            mac/app/main.py

      - name: Sign (same certificate every build, so macOS keeps the permissions after updates)
        env:
          P12: ${{ secrets.MAC_SIGNING_P12 }}
          P12_PASSWORD: ${{ secrets.MAC_SIGNING_PASSWORD }}
        run: |
          APP="dist/Saad Shard Sniper.app"
          if [ -n "$P12" ]; then
            KC="$RUNNER_TEMP/signing.keychain-db"; KCPW="$(uuidgen)"
            echo "$P12" | base64 --decode > "$RUNNER_TEMP/signing.p12"
            security create-keychain -p "$KCPW" "$KC"
            security set-keychain-settings -lut 21600 "$KC"
            security unlock-keychain -p "$KCPW" "$KC"
            security import "$RUNNER_TEMP/signing.p12" -k "$KC" -P "$P12_PASSWORD" -T /usr/bin/codesign
            security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KCPW" "$KC" >/dev/null
            security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
            security find-certificate -c "Saad Shard Sniper Signing" -p "$KC" > "$RUNNER_TEMP/signing.pem"
            sudo security add-trusted-cert -d -r trustRoot -p codeSign -k /Library/Keychains/System.keychain "$RUNNER_TEMP/signing.pem"
            codesign --force --deep --keychain "$KC" -s "Saad Shard Sniper Signing" "$APP"
            rm -f "$RUNNER_TEMP/signing.p12"
          else
            echo "::warning::No MAC_SIGNING_P12 secret - ad-hoc signature (permissions reset on every update)"
            codesign --force --deep -s - "$APP"
          fi
          codesign --verify --deep --strict "$APP" && echo "signature OK"
          echo "designated requirement (must be the same every build):"
          codesign -d -r- "$APP" 2>&1 | tail -n 1

      - name: App self-test
        run: '"dist/Saad Shard Sniper.app/Contents/MacOS/Saad Shard Sniper" --selftest'

      - name: Package
        run: |
          cp mac/README-client.txt "dist/اقرأني - Read me.txt"
          cd dist
          ditto -c -k --keepParent "Saad Shard Sniper.app" "../SaadShardSniper-mac-${{ matrix.arch }}.zip"
          cd ..
          zip -j "SaadShardSniper-mac-${{ matrix.arch }}.zip" "dist/اقرأني - Read me.txt"

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="mac-v${{ inputs.version }}"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "Saad Shard Sniper Mac v${{ inputs.version }}" --notes "Mac build" --latest=false || true
          gh release upload "$TAG" "SaadShardSniper-mac-${{ matrix.arch }}.zip" --clobber
